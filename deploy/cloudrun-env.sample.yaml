# Copy to deploy/cloudrun-env.yaml (gitignored) and fill in your Gemini key.
# Apply to Cloud Run:
#   .\scripts\set-cloudrun-env.ps1
#
# Or: gcloud run services update letaicook-api --region us-central1 --env-vars-file deploy/cloudrun-env.yaml

GOOGLE_API_KEY: "YOUR_GEMINI_API_KEY"
# Include your Cloud Run web URL (from deploy-web-cloudrun.ps1), not only Firebase Hosting:
CORS_ORIGINS: "https://letaicook-web-XXXXX-uc.a.run.app,http://localhost:3000"
