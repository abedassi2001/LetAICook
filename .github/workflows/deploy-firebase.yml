# Deploy letAIcook to Google Cloud / Firebase on push to main (or manual dispatch).
#
# Required GitHub repository secrets:
#   GCP_PROJECT_ID          — Firebase / GCP project id (e.g. letaicook)
#   GCP_SA_KEY              — JSON key for github-deploy SA (not firebase-adminsdk).
#                             IAM on project: Cloud Run Admin, Artifact Registry Admin,
#                             Service Account User, Service Usage Admin,
#                             Firebase Rules Admin (roles/firebaserules.admin) — required for rules deploy.
#   GOOGLE_API_KEY          — Gemini API key for Cloud Run API
#   FIREBASE_WEB_API_KEY    — Firebase web apiKey (required)
#   FIREBASE_MESSAGING_SENDER_ID — Firebase web messagingSenderId (required)
#   FIREBASE_APP_ID         — Firebase web appId (required)
# Optional overrides (default from GCP_PROJECT_ID if omitted):
#   FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET
#
# Optional repository variables:
#   GCP_REGION              — default us-central1
#   CLOUD_RUN_SERVICE       — API service name, default letaicook-api
#   CLOUD_RUN_WEB_SERVICE   — Web service name, default letaicook-web

name: Deploy to Firebase / Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Enable APIs
        run: |
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe letaicook \
            --location=${{ vars.GCP_REGION || 'us-central1' }} 2>/dev/null || \
          gcloud artifacts repositories create letaicook \
            --repository-format=docker \
            --location=${{ vars.GCP_REGION || 'us-central1' }}

      - name: Build and deploy API to Cloud Run
        id: deploy
        env:
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'letaicook-api' }}
          WEB_SERVICE: ${{ vars.CLOUD_RUN_WEB_SERVICE || 'letaicook-web' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letaicook/${SERVICE}:${GITHUB_SHA}"
          docker build -f apps/api/Dockerfile.prod -t "$IMAGE" apps/api
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

          WEB_URL=$(gcloud run services describe "$WEB_SERVICE" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)
          CORS="http://localhost:3000"
          if [ -n "$WEB_URL" ]; then
            CORS="${WEB_URL},${CORS}"
          fi

          {
            echo "GOOGLE_API_KEY: \"${GOOGLE_API_KEY}\""
            echo "CORS_ORIGINS: \"${CORS}\""
          } > /tmp/cloudrun-env.yaml

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --port 8080 \
            --env-vars-file /tmp/cloudrun-env.yaml

          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    outputs:
      web_url: ${{ steps.deploy-web.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve Firebase web config
        id: fb
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          API_KEY_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          MSG_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          MSG_ID_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          APP_ID_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          AUTH_DOMAIN_IN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          AUTH_DOMAIN_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_IN: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_PROJECT_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          STORAGE_IN: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          STORAGE_ALT: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        run: |
          resolved_api="${API_KEY:-$API_KEY_ALT}"
          resolved_msg="${MSG_ID:-$MSG_ID_ALT}"
          resolved_app="${APP_ID:-$APP_ID_ALT}"
          missing=""
          [ -z "$PROJECT" ] && missing="$missing GCP_PROJECT_ID"
          [ -z "$resolved_api" ] && missing="$missing FIREBASE_WEB_API_KEY (or NEXT_PUBLIC_FIREBASE_API_KEY)"
          [ -z "$resolved_msg" ] && missing="$missing FIREBASE_MESSAGING_SENDER_ID (or NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)"
          [ -z "$resolved_app" ] && missing="$missing FIREBASE_APP_ID (or NEXT_PUBLIC_FIREBASE_APP_ID)"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            echo "Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Copy values from apps/web/.env.production.local (value only, not the NEXT_PUBLIC_ prefix in the name unless using ALT names above)."
            exit 1
          fi
          AUTH_DOMAIN="${AUTH_DOMAIN_IN:-$AUTH_DOMAIN_ALT}"
          FB_PROJECT="${FB_PROJECT_IN:-$FB_PROJECT_ALT}"
          STORAGE="${STORAGE_IN:-$STORAGE_ALT}"
          [ -z "$AUTH_DOMAIN" ] && AUTH_DOMAIN="${PROJECT}.firebaseapp.com"
          [ -z "$FB_PROJECT" ] && FB_PROJECT="$PROJECT"
          [ -z "$STORAGE" ] && STORAGE="${PROJECT}.firebasestorage.app"
          echo "api_key=$resolved_api" >> "$GITHUB_OUTPUT"
          echo "messaging_sender_id=$resolved_msg" >> "$GITHUB_OUTPUT"
          echo "app_id=$resolved_app" >> "$GITHUB_OUTPUT"
          echo "auth_domain=$AUTH_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "project_id=$FB_PROJECT" >> "$GITHUB_OUTPUT"
          echo "storage_bucket=$STORAGE" >> "$GITHUB_OUTPUT"

      - name: Write production env for Next build
        working-directory: apps/web
        env:
          API_URL: ${{ needs.deploy-api.outputs.api_url }}
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ steps.fb.outputs.api_key }}" > .env.production.local
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ steps.fb.outputs.auth_domain }}" >> .env.production.local
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ steps.fb.outputs.project_id }}" >> .env.production.local
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ steps.fb.outputs.storage_bucket }}" >> .env.production.local
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ steps.fb.outputs.messaging_sender_id }}" >> .env.production.local
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ steps.fb.outputs.app_id }}" >> .env.production.local
          echo "NEXT_PUBLIC_API_BASE_URL=${API_URL}" >> .env.production.local

      - name: Build and deploy web to Cloud Run
        id: deploy-web
        env:
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_WEB_SERVICE || 'letaicook-web' }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/letaicook/${SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile.prod -t "$IMAGE" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${{ steps.fb.outputs.api_key }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ steps.fb.outputs.auth_domain }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ steps.fb.outputs.project_id }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ steps.fb.outputs.storage_bucket }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ steps.fb.outputs.messaging_sender_id }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${{ steps.fb.outputs.app_id }}" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${{ needs.deploy-api.outputs.api_url }}" \
            .
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --cpu-boost \
            --timeout 300
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - name: Update API CORS with web URL
        env:
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          API_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'letaicook-api' }}
          WEB_URL: ${{ steps.deploy-web.outputs.url }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          {
            echo "GOOGLE_API_KEY: \"${GOOGLE_API_KEY}\""
            echo "CORS_ORIGINS: \"${WEB_URL},http://localhost:3000\""
          } > /tmp/cloudrun-env.yaml
          gcloud run services update "$API_SERVICE" \
            --region "$REGION" \
            --env-vars-file /tmp/cloudrun-env.yaml

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        run: |
          firebase deploy --only firestore:rules \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive
