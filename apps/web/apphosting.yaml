# Firebase App Hosting (optional Git-connected deploy).
# Set secrets in Firebase console → App Hosting → Environment.
# https://firebase.google.com/docs/app-hosting

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  # Public Firebase web config (also set in App Hosting UI or Secret Manager).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID
  # FastAPI on Cloud Run — set after first API deploy (see deploy/README.md).
  - variable: NEXT_PUBLIC_API_BASE_URL
    secret: LETAICOOK_API_BASE_URL
